<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTibia MMO - Ultra Necrozma & Intercambios</title>
    <style>
        body { 
            margin: 0; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            font-family: Arial, sans-serif; 
        }
        h1 { color: #ffcb05; font-size: 14px; margin: 2px 0; }
        .game-panel {
            max-width: 390px;
            margin: 0 auto;
            background: #1e1e1e;
            border: 2px solid #ffcb05;
            border-radius: 8px;
            padding: 4px;
            box-sizing: border-box;
        }
        p { margin: 2px 0; font-size: 10px; }
        .bar-bg { width: 100%; background: #444; height: 6px; border-radius: 4px; overflow: hidden; margin: 2px 0; }
        .bar-fill { height: 100%; background: #3b4cca; width: 0%; transition: width 0.3s; }
        .hp-fill { background: #28a745; }
        
        #game-arena { 
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #ffcb05; 
            border-radius: 6px; 
            margin: 2px auto;
            width: 360px;
            height: 130px;
            background: linear-gradient(to bottom, #2b580c, #488c14);
            box-sizing: border-box;
            padding: 10px;
            transition: background 0.5s ease;
        }

        .battle-card {
            background: rgba(0,0,0,0.7);
            border: 1px solid #ffcb05;
            border-radius: 6px;
            padding: 6px;
            width: 46%;
            font-size: 9px;
            text-align: center;
        }
        .battle-card img { width: 45px; height: 45px; display: block; margin: 0 auto; }

        .team-bar {
            display: flex;
            justify-content: space-around;
            background: #2a2a2a;
            border-radius: 6px;
            padding: 2px;
            margin: 2px 0;
        }
        .poke-slot {
            width: 31%;
            background: #333;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 2px;
            cursor: pointer;
            font-size: 9px;
        }
        .poke-slot.active { border-color: #ffcb05; background: #443c15; }
        .poke-slot img { width: 30px; height: 30px; display: block; margin: 0 auto; }

        .dpad-container {
            margin-top: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dpad-row { display: flex; }
        .dpad-btn, .action-btn, .menu-btn {
            background: #e3350d;
            color: white;
            font-weight: bold;
            border: 2px solid #ffcb05;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
        }
        .dpad-btn { width: 34px; height: 34px; font-size: 12px; margin: 1px; }
        .action-btn { width: 31%; padding: 4px; margin-top: 2px; font-size: 9px; display: inline-block; }
        .menu-btn { width: 23%; padding: 4px; margin: 1px; font-size: 8px; background: #3b4cca; display: inline-block; }
        .btn-green { background: #28a745; }
        .btn-blue { background: #3b4cca; }
        .btn-orange { background: #d97706; }
        .btn-purple { background: #8a2be2; }
        .btn-shop { background: #d97706; }
        .btn-trade { background: #9c27b0; }

        .modal-window {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 330px;
            max-height: 82vh;
            background: #1a1a1a;
            border: 3px solid #ffcb05;
            border-radius: 8px;
            padding: 8px;
            z-index: 9999;
            box-shadow: 0 0 15px rgba(0,0,0,0.9);
            text-align: left;
            overflow-y: auto;
            font-size: 10px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ffcb05;
            padding-bottom: 3px;
            margin-bottom: 4px;
            color: #ffcb05;
            font-weight: bold;
        }
        .close-btn { background: #e3350d; color: #fff; border: none; border-radius: 4px; cursor: pointer; padding: 2px 5px; }

        .box-section {
            background: #2a2a2a;
            border: 1px solid #ffcb05;
            border-radius: 6px;
            padding: 3px;
            margin-top: 2px;
            font-size: 9px;
            text-align: left;
        }
        .shop-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 3px;
            margin: 2px 0;
            border-radius: 4px;
            border: 1px solid #444;
        }
        .buy-action-btn { padding: 2px 5px; font-size: 8px; background: #ffcb05; color: #000; font-weight: bold; border: none; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>

        <h1>PokeTibia MMO - <span style="color:#ffcb05;">👑 chuodz [ADMIN]</span></h1>
        <p>🔴 Balls: <b id="pokeballs">10</b> | 💰 $<span id="coins">5000</span> | 🟢 Online: <span id="online-players">1</span> | <span id="depot-status" style="color:#28a745;">Zona: Ruta 1 (Lv.1+)</span></p>

        <div id="team-container" class="team-bar"></div>

                <span id="e-hp-text">60/60 HP</span>
            </div>
            
            <div class="battle-card" id="player-battle-card">

        </div>

        <p id="battle-log">¡Combate MMO táctico activo!</p>
        
        <!-- BARRA DE ACCIONES -->
        <div>
            <button class="action-btn btn-green" onclick="castSpell('fast')">⚡ Ataque Rápido</button>

            <button class="action-btn btn-blue" onclick="tryCatch()">🔴 Pokéball</button>
        </div>
        <button class="action-btn btn-blue" style="width:100%; margin-top:2px;" onclick="changeRoute()">🗺️ Cambiar de Ruta (+10 Lvls, Máx 1000)</button>
        <button class="action-btn btn-purple" style="width:100%; margin-top:2px;" onclick="triggerUltraBoss()">🌌 Invocación: Jefe Ultra Necrozma</button>

        <!-- BOTONES DE MENÚ -->
        <div style="margin-top:3px;">
            <button class="menu-btn" onclick="toggleModal('shop-modal')">🛒 Tienda</button>
            <button class="menu-btn" onclick="toggleModal('pokedex-modal')">📖 Pokédex</button>
            <button class="menu-btn" onclick="toggleModal('inventory-modal')">🎒 Inventario</button>
            <button class="menu-btn" onclick="toggleModal('box-modal')">📦 Caja</button>
        </div>
        <button class="menu-btn btn-trade" style="width:100%; margin-top:2px;" onclick="toggleModal('trade-modal')">🔄 Intercambio de Recompensas entre Usuarios (@usuario)</button>
        <button class="menu-btn btn-shop" style="width:100%; margin-top:2px;" onclick="toggleModal('chat-modal')">💬 Chat Global & Privado</button>

        <!-- D-PAD TÁCTIL -->
